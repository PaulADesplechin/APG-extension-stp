<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 75">
  <!-- APG Logo - Faithful recreation from official branding -->
  <!-- White version for dark backgrounds -->

  <!-- Airplane icon box -->
  <g transform="translate(0, 0)">
    <!-- Black box background (white on dark bg) -->
    <rect x="0" y="4" width="52" height="42" rx="2" fill="white"/>

    <!-- Airplane silhouette - pointing up-right -->
    <g transform="translate(26, 25)">
      <!-- Fuselage -->
      <path d="M0,-14 L3,-10 L3,8 L6,12 L-6,12 L-3,8 L-3,-10 Z" fill="#1a1a1a"/>
      <!-- Wings -->
      <path d="M-16,0 L-3,-3 L-3,1 L-16,4 Z" fill="#1a1a1a"/>
      <path d="M16,0 L3,-3 L3,1 L16,4 Z" fill="#1a1a1a"/>
      <!-- Tail -->
      <path d="M-7,10 L-3,6 L-3,12 L-7,14 Z" fill="#1a1a1a"/>
      <path d="M7,10 L3,6 L3,12 L7,14 Z" fill="#1a1a1a"/>
    </g>
  </g>

  <!-- APG Text - bold, black style (white on dark bg) -->
  <text x="60" y="18" font-family="'Arial Black', 'Impact', Arial, sans-serif" font-weight="900" font-size="12" fill="rgba(255,255,255,0.6)" letter-spacing="5" text-transform="uppercase">AIR PROMOTION GROUP</text>

  <!-- Large APG letters -->
  <text x="60" y="42" font-family="'Arial Black', 'Impact', Arial, sans-serif" font-weight="900" font-size="38" fill="white" letter-spacing="3">APG</text>

  <!-- Tagline in orange -->
  <text x="0" y="68" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="12" fill="#E8871E" font-style="italic" letter-spacing="0.2">The Network for Airline Services</text>
</svg>

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f6fa;
      color: #2D2F6D;
    }
    .header {
      background: linear-gradient(135deg, #2D2F6D 0%, #1E1F4B 100%);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header img { height: 28px; width: auto; }
    .header h1 { color: #ffffff; font-size: 14px; font-weight: 600; }
    .header p { color: #a0a0b0; font-size: 11px; margin-top: 2px; }
    .header .tagline { color: #E8871E; font-size: 10px; margin-top: 1px; }
    .content { padding: 16px 20px; }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 16px;
    }
    .status-badge.idle { background: #e8f5e9; color: #2e7d32; }
    .status-badge.processing { background: #ECEEF8; color: #4A55A2; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .status-badge.idle .status-dot { background: #4caf50; }
    .status-badge.processing .status-dot { background: #4A55A2; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .btn {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #4A55A2;
      color: #ffffff;
    }
    .btn-primary:hover { background: #3B4590; transform: translateY(-1px); }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .stat-card {
      background: white;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }
    .stat-card .value { font-size: 18px; font-weight: 700; color: #2D2F6D; }
    .stat-card .label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }
    .footer {
      padding: 12px 20px;
      border-top: 1px solid #e0e0e0;
      text-align: center;
    }
    .footer a { color: #666; font-size: 11px; text-decoration: none; }
    .footer a:hover { color: #4A55A2; }
  </style>
</head>
<body>
  <div class="header">
    <img src="../icons/logo-apg.svg" alt="APG">
    <div>
      <h1>BSP Link Checker</h1>
      <p class="tagline">Risk Management</p>
    </div>
  </div>
  <div class="content">
    <div class="status-badge idle" id="statusBadge">
      <span class="status-dot"></span>
      <span id="statusText">En attente</span>
    </div>
    <a href="#" class="btn btn-primary" id="openDashboard">Ouvrir le Dashboard</a>
    <div class="stats">
      <div class="stat-card">
        <div class="value" id="totalProcessed">0</div>
        <div class="label">Traitements</div>
      </div>
      <div class="stat-card">
        <div class="value" id="lastDate">-</div>
        <div class="label">Dernier</div>
      </div>
    </div>
  </div>
  <div class="footer">
    <a href="#">APG Airlines - Risk Management</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>

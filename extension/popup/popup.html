<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d0e1a;
      color: #e0e0e8;
    }
    .header {
      background: linear-gradient(135deg, #2D2F6D 0%, #1E1F4B 100%);
      padding: 18px 20px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid #E8871E;
    }
    .header .logo-box { background: white; border-radius: 6px; padding: 4px 8px; display: flex; }
    .header .logo-box img { height: 22px; width: auto; }
    .header h1 { color: #ffffff; font-size: 14px; font-weight: 600; }
    .header .version { color: #E8871E; font-size: 10px; font-weight: 600; }
    .content { padding: 16px 20px; }

    /* Launch button (idle state) */
    .btn-bot {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      color: #fff;
      background: linear-gradient(135deg, #4A55A2, #2D2F6D);
      transition: all 0.2s;
    }
    .btn-bot:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(74,85,162,0.5); }
    .btn-bot:active { transform: translateY(0); }
    .btn-bot .bot-icon { font-size: 20px; }

    /* Running state */
    .btn-bot.running {
      background: linear-gradient(135deg, #E8871E, #c06a10);
      cursor: default;
      position: relative;
      overflow: hidden;
    }
    .btn-bot.running:hover { transform: none; box-shadow: none; }
    .btn-bot.running::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 200%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      animation: shimmer 2s infinite;
    }
    @keyframes shimmer { 0% { left: -100%; } 100% { left: 100%; } }

    /* Stop button */
    .btn-stop {
      display: none;
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border: 1px solid #e74c3c;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      color: #e74c3c;
      background: transparent;
      transition: all 0.2s;
    }
    .btn-stop:hover { background: rgba(231,76,60,0.1); }
    .btn-stop.visible { display: block; }

    .separator {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 14px 0;
      font-size: 10px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .separator::before, .separator::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #2a2b3d;
    }

    .btn-secondary {
      display: block;
      width: 100%;
      padding: 10px;
      border: 1px solid #2a2b3d;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      color: #a0a0b0;
      background: transparent;
      transition: all 0.2s;
    }
    .btn-secondary:hover { border-color: #4A55A2; color: #fff; background: rgba(74,85,162,0.1); }

    /* Status stages */
    .bot-status {
      margin-top: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #141526;
      border: 1px solid #2a2b3d;
      display: none;
    }
    .bot-status.visible { display: block; }
    .bot-status .stage {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #8888aa;
      padding: 4px 0;
    }
    .bot-status .stage.active { color: #E8871E; font-weight: 600; }
    .bot-status .stage.done { color: #4caf50; }
    .bot-status .stage.error { color: #e74c3c; }
    .bot-status .stage-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #333;
      flex-shrink: 0;
    }
    .bot-status .stage.active .stage-dot { background: #E8871E; animation: pulse 1.2s infinite; }
    .bot-status .stage.done .stage-dot { background: #4caf50; }
    .bot-status .stage.error .stage-dot { background: #e74c3c; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.3; } }

    /* Stats row */
    .stats {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .stat {
      flex: 1;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      background: #141526;
      border: 1px solid #1e1f32;
    }
    .stat .val { font-size: 16px; font-weight: 700; color: #4A55A2; }
    .stat .lbl { font-size: 9px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }

    .footer {
      padding: 10px 20px;
      border-top: 1px solid #1e1f32;
      text-align: center;
      font-size: 10px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-box"><img src="../icons/logo-apg.png" alt="APG"></div>
    <div>
      <h1>APG Assistant</h1>
      <span class="version">v5.0</span>
    </div>
  </div>

  <div class="content">
    <button class="btn-bot" id="btnLaunchBot">
      <span class="bot-icon">🚀</span>
      <span id="btnLabel">Lancer l'Assistant</span>
    </button>

    <button class="btn-stop" id="btnStopBot">Arreter l'Assistant</button>

    <div class="bot-status" id="botStatus">
      <div class="stage" id="stage-connexion" data-stage="connexion">
        <span class="stage-dot"></span> Connexion IATA Portal
      </div>
      <div class="stage" id="stage-import" data-stage="import">
        <span class="stage-dot"></span> Import fichier Excel
      </div>
      <div class="stage" id="stage-verification" data-stage="verification">
        <span class="stage-dot"></span> Verification des statuts
      </div>
      <div class="stage" id="stage-export" data-stage="export">
        <span class="stage-dot"></span> Excel final
      </div>
    </div>

    <div class="separator">ou</div>

    <a href="#" class="btn-secondary" id="openDashboard">Ouvrir le Dashboard</a>

    <div class="stats">
      <div class="stat">
        <div class="val" id="totalProcessed">0</div>
        <div class="lbl">Traitements</div>
      </div>
      <div class="stat">
        <div class="val" id="lastDate">-</div>
        <div class="lbl">Dernier</div>
      </div>
    </div>
  </div>

  <div class="footer">APG Airlines — Risk Management</div>

  <script src="popup.js"></script>
</body>
</html>
